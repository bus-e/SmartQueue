# Один вход для всех клиентов: API, WebSocket и страница очереди идут на сервер.
# HTTPS (Let's Encrypt) добавляется при развёртывании в облаке, спринт 3.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;

    # API и WebSocket /api/v1/ws/... — один адрес
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /docs { proxy_pass http://api:8000; }

    location / { return 200 "SmartQueue\n"; add_header Content-Type text/plain; }
}
