# Запуск всей системы: docker compose up --build
# После запуска: http://localhost:8080/api/v1/health и http://localhost:8080/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartqueue
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartqueue}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue"]
      interval: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://smartqueue:${POSTGRES_PASSWORD:-smartqueue}@db:5432/smartqueue
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  db-data:
